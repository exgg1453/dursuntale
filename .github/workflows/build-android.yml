name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: 4.3-stable

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Download Godot Android export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          # Only the Android templates are needed; extracting the full .tpz costs
          # several GB of disk and time for templates this job never uses.
          unzip -q -j -o "Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            'templates/android_debug.apk' 'templates/android_release.apk' \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls -lh "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          # Godot 4.3 reads the debug keystore from these variables when the
          # preset leaves keystore/debug* empty, so the committed preset stays
          # free of machine-specific paths.
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Import project assets
        run: |
          # Godot resolves export/android/android_sdk_path and
          # export/android/java_sdk_path from ANDROID_HOME and JAVA_HOME the
          # first time it writes its editor settings, which this run does.
          godot --headless --path . --import

      - name: Build Android APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" "$PWD/build/dursuntale.apk" 2>&1 | tee build_log.txt

      - name: Verify APK
        run: |
          test -s build/dursuntale.apk
          ls -lh build/dursuntale.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/dursuntale.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dursuntale-apk
          path: build/dursuntale.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dursuntale.apk
          name: "Dursuntale ${{ github.ref_name }}"
          body: |
            ## Dursuntale ${{ github.ref_name }}

            Android APK otomatik olarak build edildi.

            ### Kurulum
            1. APK dosyasını indir
            2. Android ayarlarından "Bilinmeyen kaynaklardan yükleme"yi etkinleştir
            3. APK'yı kur ve oyna!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
