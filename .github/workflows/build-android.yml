name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;23.2.8568313"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Download Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          echo "Godot kuruldu: $(godot --version)"

      - name: Download Godot Android Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          echo "Export template'ler kuruldu ✓"

      - name: Setup Godot Android Config
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = ""
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore oluşturuldu ✓"

      - name: Update export preset with keystore
        run: |
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$(pwd)/debug.keystore\"|g" export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|g' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|g' export_presets.cfg

      - name: Import project assets
        run: |
          mkdir -p build
          # DÜZELTME: --path önce gelmeli
          timeout 120 godot --headless --path . --import || true
          echo "Asset import tamamlandı ✓"

      - name: Debug Android SDK contents
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "--- SDK root ---"
            ls -la "$ANDROID_HOME" || true
            echo "--- build-tools ---"
            ls -la "$ANDROID_HOME/build-tools" 2>&1 || true
            ls -la "$ANDROID_HOME/build-tools/34.0.0" 2>&1 || true
            echo "--- platform-tools ---"
            ls -la "$ANDROID_HOME/platform-tools" 2>&1 || true
            echo "--- platforms ---"
            ls -la "$ANDROID_HOME/platforms" 2>&1 || true
            echo "--- editor settings ---"
            cat ~/.config/godot/editor_settings-4.tres || true
            echo "--- export_presets.cfg ---"
            cat export_presets.cfg || true
            echo "--- debug.keystore ---"
            ls -la debug.keystore || true
          } | tee diag_log.txt

      - name: Build Android APK
        run: |
          set -o pipefail
          mkdir -p build
          # DÜZELTME: --path --export-debug'dan önce, çıktı yolu absolute olmalı
          # NOT: Godot'un headless export'unda bilinen bir race condition var
          # (EditorFileSystem taraması bitmeden export tetiklenebiliyor), bu yüzden
          # başarısız olursa birkaç kez tekrar deniyoruz.
          success=false
          for attempt in 1 2 3; do
            echo "=== Export denemesi $attempt/3 ===" | tee -a build_log.txt
            rm -f "$(pwd)/build/dursuntale.apk"
            if godot --headless --path . --export-debug "Android" "$(pwd)/build/dursuntale.apk" 2>&1 | tee -a build_log.txt; then
              :
            fi
            if [ -s "$(pwd)/build/dursuntale.apk" ]; then
              echo "Deneme $attempt başarılı ✓" | tee -a build_log.txt
              success=true
              break
            fi
            echo "Deneme $attempt başarısız, tekrar deneniyor..." | tee -a build_log.txt
            sleep 5
          done
          if [ "$success" = false ]; then
            echo "Tüm denemeler başarısız oldu ✗" | tee -a build_log.txt
            exit 1
          fi
          echo "APK build tamamlandı ✓"

      - name: Save error log
        if: failure()
        run: cat diag_log.txt build_log.txt > error.txt 2>/dev/null || cp build_log.txt error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: error.txt
          retention-days: 30

      - name: Verify APK
        run: |
          if [ -f "build/dursuntale.apk" ]; then
            echo "✅ APK başarıyla oluşturuldu!"
            ls -lh build/dursuntale.apk
          else
            echo "❌ APK oluşturulamadı!"
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dursuntale-apk
          path: build/dursuntale.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dursuntale.apk
          name: "Dursuntale ${{ github.ref_name }}"
          body: |
            ## Dursuntale ${{ github.ref_name }}
            
            Android APK otomatik olarak build edildi.
            
            ### Kurulum
            1. APK dosyasını indir
            2. Android ayarlarından "Bilinmeyen kaynaklardan yükleme"yi etkinleştir
            3. APK'yı kur ve oyna!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
